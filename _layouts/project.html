---
layout: default
---

<div class="container pt-5 pb-5">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="display-4 font-weight-bold">{{ page.title }}</h1>
            <p class="text-muted">
                <i class="fas fa-calendar-alt mr-2"></i> {{ page.date | date: "%Y-%m-%d" }}
                {% if page.author %} · <i class="fas fa-user ml-2 mr-2"></i> {{ page.author }} {% endif %}
            </p>
            <hr>
        </div>
    </div>

    <div class="row">
        <div class="col-12 content-body">
            {% if page.image %}
            <img src="{{ page.image | relative_url }}" class="img-fluid rounded mb-4 shadow-sm" style="width: 100%; max-height: 500px; object-fit: cover;">
            {% endif %}

            {{ content }}
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-12">
            <a href="{{ '/projects/' | relative_url }}" class="btn btn-outline-primary">
                <i class="fas fa-arrow-left mr-2"></i> Return
            </a>
        </div>
    </div>
</div>
